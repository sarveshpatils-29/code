<!DOCTYPE html>
<html>
<head>
    <title>Student Information App</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Information App</h2>

        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="text" id="roll" placeholder="Enter Roll Number">

        <input type="text" id="course" placeholder="Enter Course">

        <br><br>

        <button onclick="addStudent()">Submit</button>

        <div id="result"></div>

    </div>

    <script>
        function addStudent() {

            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let course = document.getElementById("course").value;

            if (name == "" || roll == "" || course == "") {
                alert("Please fill all fields");
                return;
            }

            document.getElementById("result").innerHTML =
                "<h3>Student Details</h3>" +
                "Name: " + name + "<br>" +
                "Roll Number: " + roll + "<br>" +
                "Course: " + course;

        }
    </script>

</body>
</html>
